apiVersion: mcoperator.sdv.com/v1
kind: McKube
metadata:
  name: planner-mckube-config
  namespace: default
spec:
  podname: "tasks-planner-bench"
  criticality: "high"
  rtSettings:
    period: 15000
    runtime: 12000      # 50ms runtime
    core: "2"           # Use core 2
---
apiVersion: v1
kind: Pod
metadata:
  name: tasks-planner-bench
  namespace: default
  labels:
    app: tasks-planner-bench
spec:
  containers:
    - name: planner
      image: ghcr.io/hufs-mco/test-task:HCBSv1
      args: ["planner"]
      volumeMounts:
      - name: shared-socket
        mountPath: /tmp
  volumes:
  - name: shared-socket
    hostPath:
      path: /tmp/e2e-shared-sockets
      type: DirectoryOrCreate
---
apiVersion: mcoperator.sdv.com/v1
kind: McKube
metadata:
  name: ekf-mckube-config
  namespace: default
spec:
  podname: "tasks-ekf-bench"
  criticality: "high"
  rtSettings:
    period: 15000      # 100ms period for ekf
    runtime: 4000      # 40ms runtime
    core: "3"           # Use core 3
---
apiVersion: v1
kind: Pod
metadata:
  name: tasks-ekf-bench
  namespace: default
  labels:
    app: tasks-ekf-bench
spec:
  containers:
    - name: ekf
      image: ghcr.io/hufs-mco/test-task:HCBSv1
      args: ["ekf"]
      volumeMounts:
      - name: shared-socket
        mountPath: /tmp
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "rm -f /tmp/ekf_to_planner.sock || true"]
  volumes:
  - name: shared-socket
    hostPath:
      path: /tmp/e2e-shared-sockets
      type: DirectoryOrCreate
---
